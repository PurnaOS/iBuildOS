name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    # ubuntu × macos is the byte-identity guard (TECH-STACK.md T-013/S-5):
    # if the OKF store's round-trip fidelity or the rule engine's findings
    # regress on one OS but not the other, this catches it. Windows joins
    # once apps/desktop exists (S-4).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
