formats: 1
name: synthetic-fixture-bad-build
version: 1.0.0
engine: ">=1.0.0 <2.0.0"
description: >-
  Deliberately broken counter-example: identical to good-template except its "build" contract
  command exits non-zero, proving the harness reports a command failure as a failure (not a
  false pass, and without stopping the rest of the pipeline from running and reporting too).
contract:
  components:
    app:
      paths: ["**"]
      commands:
        lint: ["pnpm", "run", "lint"]
        build: ["pnpm", "run", "build"]
        migrate: ["pnpm", "run", "migrate"]
        seed: ["pnpm", "run", "seed"]
        test: ["pnpm", "run", "test"]
        dev: ["pnpm", "run", "dev"]
      preview:
        url: "http://localhost:4321"
        ready: { path: "/", status: 200 }
      safe: [lint, test]
profile: "ibuildos-default@1.0.0"
environments: {}
deploy: {}
